<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | ZELIMU CBC"><link rel="stylesheet" href="/css/app.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#eef3f8,#f8fafc)}.reset-card{width:min(100%,440px);padding:34px;background:#fff;border:1px solid #dfe7ef;border-radius:20px;box-shadow:0 20px 60px #15304b18}.reset-brand{font-weight:900;letter-spacing:.13em;color:#17365d}.reset-card h1{font-size:1.7rem;margin:22px 0 8px}.reset-card p{color:#68788b;line-height:1.6}.reset-card label{display:block;font-weight:750;font-size:.84rem;margin:18px 0}.reset-card input{display:block;width:100%;margin-top:8px;padding:13px;border:1px solid #cbd6e1!important;border-radius:10px}.reset-card button{width:100%;padding:13px;border:0;border-radius:10px;background:#173f68;color:white;font-weight:800;cursor:pointer}.status{min-height:24px;font-size:.85rem;color:#b42318}.status.success{color:#176b48}a{color:#1d5688;font-weight:750}</style><link rel="stylesheet" href="/css/zelimu-brand-system.css"></head><body><main class="reset-card"><div class="reset-brand">ZELIMU CBC</div><h1>Choose a new password</h1><p>Use at least 10 characters. This secure link can only be used once.</p><form id="resetForm"><label>New password<input id="pw" type="password" minlength="10" autocomplete="new-password" required></label><label>Confirm new password<input id="confirm" type="password" minlength="10" autocomplete="new-password" required></label><button id="submit" type="submit">Reset password</button><p id="status" class="status" role="status" aria-live="polite"></p></form><a href="/login.html">Back to sign in</a></main><script>(function(){const token=new URLSearchParams(location.search).get('token'),form=document.getElementById('resetForm'),status=document.getElementById('status'),button=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();if(!token){status.textContent='This reset link is missing or invalid. Request a new one.';return;}const pw=document.getElementById('pw').value,confirm=document.getElementById('confirm').value;if(pw!==confirm){status.textContent='The passwords do not match.';return;}button.disabled=true;status.textContent='Updating password…';try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:pw})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to reset password.');status.className='status success';status.textContent=d.message||'Password reset successfully.';form.reset();}catch(err){status.textContent=err.message;}finally{button.disabled=false;}});})();</script></body></html>
